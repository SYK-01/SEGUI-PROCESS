<div class="login-wrap">
  <mat-card class="login-card" (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave($event)">
    <div class="login-header">
    <h1>SEGUI <span class="ti">TI</span></h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="ingresar()">

       <label class="field-label">Usuario</label>
        <mat-form-field appearance="outline" class="full">
        <input matInput formControlName="Nom_Usuario" autocomplete="username">
        </mat-form-field>

        <label class="field-label">Contraseña</label>
        <mat-form-field appearance="outline" class="full">
       <input matInput [type]="ocultarPassword ? 'password' : 'text'" formControlName="Pwd_Usuario" autocomplete="current-password">
      </mat-form-field>

      <button mat-flat-button class="full boton-ingresar" type="submit" [disabled]="cargando">
        @if (cargando) {
          <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
        } @else {
          <span>Ingresar</span>
        }
      </button>
    </form>
  </mat-card>
</div>
